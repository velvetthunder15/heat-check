# Cloudflare Pages project config (Git-based deploys read this file).
# Build command: node tools/build.mjs     Output directory: dist
# Secrets (SUPABASE_SERVICE_KEY, RAZORPAY_KEY_SECRET, ...) are set in the
# Pages dashboard or with `wrangler pages secret put NAME`, never here.
name = "heat-check"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[vars]
# Primary URL. Everything (CORS, canonical, og tags, manifest, sitemap, legal pages) follows it.
# v17 (Oct 13 2026): www.playheatcheck.app, because the apex playheatcheck.app can't get a
# Pages certificate while DNS stays at name.com (Pages needs a Cloudflare zone for apex domains).
# When the apex is active in Pages: set SITE_URL = "https://playheatcheck.app" and
# REDIRECT_HOSTS = "www.playheatcheck.app,heat-check-a9b.pages.dev" (also the dashboard SITE_URL).
SITE_URL = "https://playheatcheck.app"
# Extra browser origins the /api middleware accepts (CORS), comma separated.
ALT_HOSTS = "playheatcheck.app,www.playheatcheck.app,heat-check-a9b.pages.dev"
# Hosts whose page navigations get a 301 to SITE_URL (functions/_middleware.js). Never /api/*.
# Empty = no redirects (pages.dev keeps serving the app as before).
REDIRECT_HOSTS = "www.playheatcheck.app,heat-check-a9b.pages.dev"
# Public values (safe to commit). Secrets live in the Pages dashboard.
SUPABASE_URL = "https://cpxfmecrqxlfzcldolcj.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNweGZtZWNycXhsZnpjbGRvbGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzQzNDIsImV4cCI6MjEwNzIxMDM0Mn0.bBOPCeS4IWoz3DvqmyBbeQ5i_L8QFCxZjiTqvja6gW4"
RAZORPAY_KEY_ID = "rzp_test_TmExEri3JFq9rj"
TURNSTILE_SITE_KEY = "0x4AAAAAAFTH086q2Amv_Y0F"

# Rate limiting store. Create it once:
#   npx wrangler kv namespace create RATE_KV
# then paste the id below and remove the leading # on the three lines.
[[kv_namespaces]]
binding = "RATE_KV"
id = "9fff546c2b7c42e48878e09676d71cc9"
